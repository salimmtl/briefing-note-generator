App:
  Properties:
    Formulas: |-
      =// ---------- Palette ----------
      ClrCanvas = RGBA(245, 246, 248, 1);
      ClrSurface = RGBA(255, 255, 255, 1);
      ClrBorder = RGBA(225, 228, 232, 1);
      ClrText = RGBA(36, 36, 36, 1);
      ClrTextSecondary = RGBA(97, 97, 97, 1);
      ClrAccent = RGBA(15, 108, 189, 1);
      ClrAccentHover = RGBA(17, 94, 163, 1);
      ClrAccentTint = RGBA(235, 243, 252, 1);
      ClrRed = RGBA(196, 49, 75, 1);
      ClrRedTint = RGBA(253, 231, 233, 1);

      // ---------- Reference lists ----------
      Lanes = Table(
          {LaneName: "In progress", LaneOrder: 1, LaneFg: RGBA(15, 108, 189, 1), LaneBg: RGBA(235, 243, 252, 1)},
          {LaneName: "Needs info", LaneOrder: 2, LaneFg: RGBA(188, 75, 9, 1), LaneBg: RGBA(255, 244, 206, 1)},
          {LaneName: "In review", LaneOrder: 3, LaneFg: RGBA(92, 46, 145, 1), LaneBg: RGBA(239, 233, 246, 1)},
          {LaneName: "Approved", LaneOrder: 4, LaneFg: RGBA(16, 124, 16, 1), LaneBg: RGBA(223, 246, 221, 1)},
          {LaneName: "Delivered", LaneOrder: 5, LaneFg: RGBA(16, 124, 16, 1), LaneBg: RGBA(223, 246, 221, 1)}
      );
      StatusOptions = ["Draft", "Submitted", "Drafting", "Needs Info", "Info Provided", "In Review", "Revision Requested", "Approved", "Delivered", "Cancelled", "Needs Attention"];

      // ---------- Pure helpers ----------
      LaneOf(status: Text): Text = Switch(
          status,
          "Needs Info", "Needs info",
          "In Review", "In review",
          "Approved", "Approved",
          "Delivered", "Delivered",
          "Cancelled", "Cancelled",
          "In progress"
      );
      IsOverdue(due: Date, status: Text): Boolean =
          !IsBlank(due) && due < Today() && !(status in ["Approved", "Delivered", "Cancelled"]);
      StatusFg(status: Text): Color = Switch(
          status,
          "Needs Info", RGBA(188, 75, 9, 1),
          "In Review", RGBA(92, 46, 145, 1),
          "Approved", RGBA(16, 124, 16, 1),
          "Delivered", RGBA(16, 124, 16, 1),
          "Needs Attention", RGBA(196, 49, 75, 1),
          "Draft", RGBA(97, 97, 97, 1),
          "Cancelled", RGBA(97, 97, 97, 1),
          RGBA(15, 108, 189, 1)
      );
      StatusBg(status: Text): Color = Switch(
          status,
          "Needs Info", RGBA(255, 244, 206, 1),
          "In Review", RGBA(239, 233, 246, 1),
          "Approved", RGBA(223, 246, 221, 1),
          "Delivered", RGBA(223, 246, 221, 1),
          "Needs Attention", RGBA(253, 231, 233, 1),
          "Draft", RGBA(240, 240, 240, 1),
          "Cancelled", RGBA(240, 240, 240, 1),
          RGBA(235, 243, 252, 1)
      );
      PriorityFg(priority: Text): Color = Switch(
          priority,
          "Urgent", RGBA(196, 49, 75, 1),
          "Priority", RGBA(188, 75, 9, 1),
          RGBA(97, 97, 97, 1)
      );
      PriorityBg(priority: Text): Color = Switch(
          priority,
          "Urgent", RGBA(253, 231, 233, 1),
          "Priority", RGBA(255, 244, 206, 1),
          RGBA(240, 240, 240, 1)
      );
      HtmlEsc(t: Text): Text = Substitute(Substitute(Substitute(t, "&", "&amp;"), "<", "&lt;"), ">", "&gt;");
      SectionCount(json: Text): Number = If(IsBlank(Trim(json)), 0, CountRows(Table(ParseJSON(json))));
      SectionsHtml(json: Text): Text = If(
          IsBlank(Trim(json)),
          "",
          Concat(
              Table(ParseJSON(json)) As sec,
              "<div style='font-family:Segoe UI;font-weight:600;font-size:16px;color:#242424;margin:16px 0 6px 0'>" &
              HtmlEsc(Text(sec.Value.heading)) & "</div>" &
              Concat(
                  Split(Text(sec.Value.body), Char(10)) As ln,
                  If(
                      StartsWith(Trim(ln.Value), "- "),
                      "<div style='font-family:Segoe UI;font-size:14px;color:#242424;margin:3px 0 3px 18px'>&bull; " & HtmlEsc(Mid(Trim(ln.Value), 3)) & "</div>",
                      If(
                          IsBlank(Trim(ln.Value)),
                          "",
                          "<p style='font-family:Segoe UI;font-size:14px;color:#242424;margin:4px 0'>" & HtmlEsc(Trim(ln.Value)) & "</p>"
                      )
                  )
              )
          )
      );

