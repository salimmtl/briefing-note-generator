                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  PaddingTop: =16
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  Size: =14
                  Color: =ClrTextSecondary
                  AutoHeight: =true
                  Wrap: =true
                  Width: =Parent.Width - 48
                  AlignInContainer: =AlignInContainer.Center
                  FillPortions: =0
                  AccessibleLabel: ="No activity recorded yet."
