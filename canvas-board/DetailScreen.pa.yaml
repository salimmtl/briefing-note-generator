Screens:
  DetailScreen:
    Properties:
      Fill: =ClrCanvas
    Children:
      - conDetailRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
            LayoutOverflowY: =LayoutOverflow.Scroll
            LayoutAlignItems: =LayoutAlignItems.Stretch
            Width: =Parent.Width
            Height: =Parent.Height
            LayoutMinWidth: =0
            LayoutMinHeight: =0
            Fill: =ClrCanvas
            LayoutGap: =0
            PaddingBottom: =24
          Children:
            - conDetailHeader:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutWrap: =true
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutJustifyContent: =LayoutJustifyContent.Start
                  LayoutGap: =16
                  PaddingLeft: =24
                  PaddingRight: =24
                  PaddingTop: =12
                  PaddingBottom: =12
                  Fill: =ClrSurface
                  DropShadow: =DropShadow.Light
                  FillPortions: =0
                  Height: =If(App.Width < 1000, 112, 64)
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                  AlignInContainer: =AlignInContainer.Stretch
                Children:
                  - lblDetailWordmark:
                      Control: ModernText
                      Properties:
                        Text: ="Briefing Board"
                        Size: =20
                        FontWeight: =FontWeight.Bold
                        Color: =ClrText
                        Width: =170
                        Height: =40
                        FillPortions: =0
                        Wrap: =false
                        VerticalAlign: =VerticalAlign.Middle
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        AlignInContainer: =AlignInContainer.Center
                        AccessibleLabel: ="Briefing Board"
                  - conDetailNav:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =4
                        LayoutAlignItems: =LayoutAlignItems.Center
                        Width: =320
                        Height: =40
                        FillPortions: =0
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                        AlignInContainer: =AlignInContainer.Center
                      Children:
                        - btnDetailNavBoard:
                            Control: ModernButton
                            Properties:
                              Text: ="Board"
                              OnSelect: =Navigate(Screen1, ScreenTransition.None)
                              Width: =104
                              Height: =36
                              FillPortions: =0
                              BasePaletteColor: =ClrAccent
                              Appearance: =ButtonAppearance.Subtle
                              Color: =ClrText
                              FontWeight: =FontWeight.Normal
                              AlignInContainer: =AlignInContainer.Center
                              AccessibleLabel: ="Board"
                        - btnDetailNavList:
                            Control: ModernButton
                            Properties:
                              Text: ="List"
                              OnSelect: =Navigate(ListScreen, ScreenTransition.None)
                              Width: =104
                              Height: =36
                              FillPortions: =0
                              BasePaletteColor: =ClrAccent
                              Appearance: =ButtonAppearance.Subtle
                              Color: =ClrText
                              FontWeight: =FontWeight.Normal
                              AlignInContainer: =AlignInContainer.Center
                              AccessibleLabel: ="List"
                        - btnDetailNavOverview:
                            Control: ModernButton
                            Properties:
                              Text: ="Overview"
                              OnSelect: =Navigate(OverviewScreen, ScreenTransition.None)
                              Width: =104
                              Height: =36
                              FillPortions: =0
                              BasePaletteColor: =ClrAccent
                              Appearance: =ButtonAppearance.Subtle
                              Color: =ClrText
                              FontWeight: =FontWeight.Normal
                              AlignInContainer: =AlignInContainer.Center
                              AccessibleLabel: ="Overview"
                  - conDetailHeaderSpacer:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Horizontal
                        FillPortions: =1
                        Height: =8
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                        AlignInContainer: =AlignInContainer.Center
                  - bdgDetailAttention:
                      Control: ModernBadge
                      Properties:
                        Content: =CountRows(Filter(colRequests, Status = "Needs Attention")) & " need attention"
                        Visible: =CountRows(Filter(colRequests, Status = "Needs Attention")) > 0
                        Fill: =ClrRedTint
                        BorderColor: =ClrRedTint
                        Color: =ClrRed
                        Appearance: =BadgeAppearance.Tint
                        Shape: =BadgeShape.Rounded
                        Size: =12
                        FontWeight: =FontWeight.Semibold
                        Width: =140
                        Height: =28
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Center
                        AccessibleLabel: =CountRows(Filter(colRequests, Status = "Needs Attention")) & " need attention"
                  - lblDetailUpdated:
                      Control: ModernText
                      Properties:
                        Text: ="Updated " & Text(varUpdatedAt, "hh:mm:ss")
                        Size: =12
                        Color: =ClrTextSecondary
                        Width: =120
                        Height: =28
                        FillPortions: =0
                        Wrap: =false
                        Align: =Align.Right
                        VerticalAlign: =VerticalAlign.Middle
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        AlignInContainer: =AlignInContainer.Center
                        AccessibleLabel: ="Data updated at " & Text(varUpdatedAt, "hh:mm:ss")
                  - btnDetailRefresh:
                      Control: ModernButton
                      Properties:
                        Text: ="Refresh"
                        Icon: ="ArrowClockwise"
                        Layout: =ButtonLayout.IconBefore
                        Appearance: =ButtonAppearance.Outline
                        BasePaletteColor: =ClrAccent
                        Width: =112
                        Height: =36
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Center
                        AccessibleLabel: ="Refresh data"
                        OnSelect: |-
                          =LoadBriefings();
                          Set(varUpdatedAt, Now());
                          Set(varSelected, LookUp(colRequests, Id = varSelected.Id))
            - conDetailTopBar:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutWrap: =true
                  Height: =72
                  PaddingTop: =20
                  PaddingBottom: =12
                  LayoutGap: =12
                  LayoutAlignItems: =LayoutAlignItems.Center
                  Width: =Parent.Width - 48
                  AlignInContainer: =AlignInContainer.Center
                  FillPortions: =0
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                Children:
                  - btnDetailBack:
                      Control: ModernButton
                      Properties:
                        Text: ="Back"
                        Icon: ="ArrowLeft"
                        Layout: =ButtonLayout.IconBefore
                        Appearance: =ButtonAppearance.Outline
                        BasePaletteColor: =ClrAccent
                        Width: =96
                        Height: =36
                        FillPortions: =0
                        OnSelect: =Back()
                        AlignInContainer: =AlignInContainer.Center
                        AccessibleLabel: ="Back to the previous screen"
                  - lblDetailNumber:
                      Control: ModernText
                      Properties:
                        Text: =varSelected.Number
                        Size: =16
                        FontWeight: =FontWeight.Semibold
                        Color: =ClrAccent
                        Width: =100
                        Height: =28
                        FillPortions: =0
                        Wrap: =false
                        VerticalAlign: =VerticalAlign.Middle
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        AlignInContainer: =AlignInContainer.Center
                        AccessibleLabel: ="Briefing note number " & varSelected.Number
                  - bdgDetailStatus:
                      Control: ModernBadge
                      Properties:
                        Content: =varSelected.Status
                        Fill: =StatusBg(varSelected.Status)
                        BorderColor: =StatusBg(varSelected.Status)
                        Color: =StatusFg(varSelected.Status)
                        Appearance: =BadgeAppearance.Tint
                        Shape: =BadgeShape.Rounded
                        Size: =12
                        FontWeight: =FontWeight.Semibold
                        Width: =150
                        Height: =26
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Center
                        AccessibleLabel: ="Status " & varSelected.Status
                  - bdgDetailPriority:
                      Control: ModernBadge
                      Properties:
                        Content: =varSelected.Priority
                        Visible: =!IsBlank(varSelected.Priority)
                        Fill: =PriorityBg(varSelected.Priority)
                        BorderColor: =PriorityBg(varSelected.Priority)
                        Color: =PriorityFg(varSelected.Priority)
                        Appearance: =BadgeAppearance.Tint
                        Shape: =BadgeShape.Rounded
                        Size: =12
                        FontWeight: =FontWeight.Semibold
                        Width: =80
                        Height: =26
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Center
                        AccessibleLabel: ="Priority " & varSelected.Priority
                  - bdgDetailOverdue:
                      Control: ModernBadge
                      Properties:
                        Content: ="Overdue"
                        Visible: =IsOverdue(varSelected.DueDate, varSelected.Status)
                        Fill: =ClrRedTint
                        BorderColor: =ClrRedTint
                        Color: =ClrRed
                        Appearance: =BadgeAppearance.Tint
                        Shape: =BadgeShape.Rounded
                        Size: =12
                        FontWeight: =FontWeight.Semibold
                        Width: =80
                        Height: =26
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Center
                        AccessibleLabel: ="Overdue"
            - lblDetailMissing:
                Control: ModernText
                Properties:
                  Visible: =IsBlank(varSelected.Id)
                  Text: ="This request is no longer available. Go back to the board or the list."
                  Fill: =ClrSurface
                  BorderColor: =ClrBorder
                  BorderThickness: =1
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  PaddingTop: =16
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  Size: =14
                  Color: =ClrRed
                  AutoHeight: =true
                  Wrap: =true
                  Width: =Parent.Width - 48
                  AlignInContainer: =AlignInContainer.Center
                  FillPortions: =0
                  AccessibleLabel: ="This request is no longer available"
            - lblDetailSubject:
                Control: ModernText
                Properties:
                  Text: =varSelected.Subject
                  Size: =24
                  FontWeight: =FontWeight.Bold
                  Color: =ClrText
                  AutoHeight: =true
                  Wrap: =true
                  PaddingTop: =4
                  PaddingBottom: =4
                  PaddingLeft: =0
                  PaddingRight: =0
                  Width: =Parent.Width - 48
                  AlignInContainer: =AlignInContainer.Center
                  FillPortions: =0
                  AccessibleLabel: ="Subject " & varSelected.Subject
            - lblDetailNoteTitle:
                Control: ModernText
                Properties:
                  Visible: =!IsBlank(varSelected.NoteTitle)
                  Text: '="Note title: " & varSelected.NoteTitle'
                  Size: =14
                  Color: =ClrTextSecondary
                  AutoHeight: =true
                  Wrap: =true
                  PaddingTop: =0
                  PaddingBottom: =12
                  PaddingLeft: =0
                  PaddingRight: =0
                  Width: =Parent.Width - 48
                  AlignInContainer: =AlignInContainer.Center
                  FillPortions: =0
                  AccessibleLabel: '="Note title: " & varSelected.NoteTitle'
            - galDetailMeta:
                Control: Gallery
                Variant: Vertical
                Properties:
                  Items: |-
                    =Table(
                        {Caption: "Template", Value: Coalesce(varSelected.Template, "—")},
                        {Caption: "Profile", Value: Coalesce(varSelected.Profile, "—")},
                        {Caption: "Requester", Value: Coalesce(varSelected.Requester, "—")},
                        {Caption: "Recipient", Value: Coalesce(varSelected.Recipient, "—") & If(IsBlank(varSelected.RecipientTitle), "", ", " & varSelected.RecipientTitle)},
                        {Caption: "Due date", Value: If(IsBlank(varSelected.DueDate), "—", Text(varSelected.DueDate, "dddd d mmmm yyyy"))},
                        {Caption: "Classification", Value: Coalesce(varSelected.Classification, "—")},
                        {Caption: "Language", Value: Coalesce(varSelected.Language, "—")},
                        {Caption: "Reviewer", Value: Coalesce(varSelected.Reviewer, "—")},
                        {Caption: "Submitted", Value: If(IsBlank(varSelected.SubmittedOn), "—", Text(varSelected.SubmittedOn, "d mmm yyyy hh:mm"))},
                        {Caption: "Drafted", Value: If(IsBlank(varSelected.DraftedOn), "—", Text(varSelected.DraftedOn, "d mmm yyyy hh:mm"))},
                        {Caption: "Delivered", Value: If(IsBlank(varSelected.DeliveredOn), "—", Text(varSelected.DeliveredOn, "d mmm yyyy hh:mm"))},
                        {Caption: "Draft", Value: If(varSelected.Version > 0, "Version " & varSelected.Version & " · " & varSelected.WordCount & " words", "Not drafted yet")}
                    )
                  Width: =Parent.Width - 48
                  AlignInContainer: =AlignInContainer.Center
                  FillPortions: =0
                  TemplatePadding: =0
                  TemplateSize: =64
                  WrapCount: =If(Self.Width >= 1100, 4, 3)
                  Height: =RoundUp(12 / If(Self.Width >= 1100, 4, 3), 0) * 64
                  Fill: =ClrSurface
                  BorderColor: =ClrBorder
                  BorderThickness: =1
                  ShowScrollbar: =false
                  Selectable: =false
                  TabIndex: =-1
                  AccessibleLabel: ="Request details"
                Children:
                  - conDetailMetaCell:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        Width: =Parent.TemplateWidth
                        Height: =Parent.TemplateHeight
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =3
                        PaddingBottom: =3
                        LayoutGap: =2
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                      Children:
                        - lblDetailMetaCaption:
                            Control: ModernText
                            Properties:
                              Text: =ThisItem.Caption
                              Size: =12
                              Color: =ClrTextSecondary
                              Height: =18
                              FillPortions: =0
                              Wrap: =false
                              PaddingTop: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              AlignInContainer: =AlignInContainer.Stretch
                              AccessibleLabel: =ThisItem.Caption
                        - lblDetailMetaValue:
                            Control: ModernText
                            Properties:
                              Text: =ThisItem.Value
                              Size: =14
                              Color: =ClrText
                              Height: =38
                              FillPortions: =0
                              Wrap: =true
                              VerticalAlign: =VerticalAlign.Top
                              PaddingTop: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              AlignInContainer: =AlignInContainer.Stretch
                              AccessibleLabel: =ThisItem.Caption & " " & ThisItem.Value
            - conDetailLinks:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  Height: =68
                  PaddingTop: =16
                  PaddingBottom: =12
                  LayoutGap: =12
                  LayoutAlignItems: =LayoutAlignItems.Center
                  Width: =Parent.Width - 48
                  AlignInContainer: =AlignInContainer.Center
                  FillPortions: =0
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                Children:
                  - btnDetailDraftPdf:
                      Control: ModernButton
                      Properties:
                        Icon: ="DocumentPdf"
                        Text: =If(IsBlank(varSelected.DraftPdf), "Draft PDF not available yet", "Open draft PDF")
                        DisplayMode: =If(IsBlank(varSelected.DraftPdf), DisplayMode.Disabled, DisplayMode.Edit)
                        OnSelect: =Launch(varSelected.DraftPdf)
                        Appearance: =ButtonAppearance.Outline
                        BasePaletteColor: =ClrAccent
                        Layout: =ButtonLayout.IconBefore
                        Width: =240
                        Height: =36
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Center
                        AccessibleLabel: =If(IsBlank(varSelected.DraftPdf), "Draft PDF not available yet", "Open draft PDF")
                  - btnDetailFinalPdf:
                      Control: ModernButton
                      Properties:
                        Icon: ="DocumentPdf"
                        Text: =If(IsBlank(varSelected.FinalPdf), "Final PDF not available yet", "Open final PDF")
                        DisplayMode: =If(IsBlank(varSelected.FinalPdf), DisplayMode.Disabled, DisplayMode.Edit)
                        OnSelect: =Launch(varSelected.FinalPdf)
                        Appearance: =ButtonAppearance.Outline
                        BasePaletteColor: =ClrAccent
                        Layout: =ButtonLayout.IconBefore
                        Width: =240
                        Height: =36
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Center
                        AccessibleLabel: =If(IsBlank(varSelected.FinalPdf), "Final PDF not available yet", "Open final PDF")
                  - btnDetailFolder:
                      Control: ModernButton
                      Properties:
                        Icon: ="Folder"
                        Text: =If(IsBlank(varSelected.Folder), "Folder not available yet", "Open SharePoint folder")
                        DisplayMode: =If(IsBlank(varSelected.Folder), DisplayMode.Disabled, DisplayMode.Edit)
                        OnSelect: =Launch(varSelected.Folder)
                        Appearance: =ButtonAppearance.Outline
                        BasePaletteColor: =ClrAccent
                        Layout: =ButtonLayout.IconBefore
                        Width: =240
                        Height: =36
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Center
                        AccessibleLabel: =If(IsBlank(varSelected.Folder), "Folder not available yet", "Open SharePoint folder")
            - lblDetailError:
                Control: ModernText
                Properties:
                  Visible: =!IsBlank(varSelected.LastError)
                  Text: '="Last error: " & varSelected.LastError'
                  Fill: =ClrRedTint
                  BorderColor: =ClrRedTint
                  BorderThickness: =1
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  PaddingTop: =16
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  Size: =14
                  Color: =ClrRed
                  AutoHeight: =true
                  Wrap: =true
                  Width: =Parent.Width - 48
                  AlignInContainer: =AlignInContainer.Center
                  FillPortions: =0
                  AccessibleLabel: '="Last error: " & varSelected.LastError'
            - lblDetailKeyHead:
                Control: ModernText
                Properties:
                  Text: ="Key message"
                  Size: =18
                  FontWeight: =FontWeight.Semibold
                  Color: =ClrText
                  Height: =56
                  PaddingTop: =20
                  PaddingBottom: =8
                  PaddingLeft: =0
                  PaddingRight: =0
                  Wrap: =false
                  VerticalAlign: =VerticalAlign.Bottom
                  Width: =Parent.Width - 48
                  AlignInContainer: =AlignInContainer.Center
                  FillPortions: =0
                  AccessibleLabel: ="Key message"
            - lblDetailKeyMsg:
                Control: ModernText
                Properties:
                  Text: =If(IsBlank(varSelected.KeyMessage), "No key message yet.", varSelected.KeyMessage)
                  Fill: =If(IsBlank(varSelected.KeyMessage), ClrSurface, ClrAccentTint)
                  BorderColor: =If(IsBlank(varSelected.KeyMessage), ClrSurface, ClrAccentTint)
                  BorderThickness: =1
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  PaddingTop: =16
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  Size: =16
                  Color: =If(IsBlank(varSelected.KeyMessage), ClrTextSecondary, ClrText)
                  AutoHeight: =true
                  Wrap: =true
                  Width: =Parent.Width - 48
                  AlignInContainer: =AlignInContainer.Center
                  FillPortions: =0
                  AccessibleLabel: =If(IsBlank(varSelected.KeyMessage), "No key message yet.", varSelected.KeyMessage)
            - lblDetailDraftHead:
                Control: ModernText
                Properties:
                  Text: |-
                    ="Draft" & If(IfError(SectionCount(varSelected.SectionsJson), 0) > 0, " · " & IfError(SectionCount(varSelected.SectionsJson), 0) & " sections · " & varSelected.WordCount & " words · version " & varSelected.Version, "")
                  Size: =18
                  FontWeight: =FontWeight.Semibold
                  Color: =ClrText
                  Height: =56
                  PaddingTop: =20
                  PaddingBottom: =8
                  PaddingLeft: =0
                  PaddingRight: =0
                  Wrap: =false
                  VerticalAlign: =VerticalAlign.Bottom
                  Width: =Parent.Width - 48
                  AlignInContainer: =AlignInContainer.Center
                  FillPortions: =0
                  AccessibleLabel: ="Draft sections"
            - htmDetailDraft:
                Control: HtmlViewer
                Properties:
                  HtmlText: =IfError(SectionsHtml(varSelected.SectionsJson), "")
                  AutoHeight: =true
                  Visible: =IfError(SectionCount(varSelected.SectionsJson), 0) > 0
                  Fill: =ClrSurface
                  BorderColor: =ClrBorder
                  BorderThickness: =1
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =4
                  PaddingBottom: =16
                  Size: =14
                  Color: =ClrText
                  Width: =Parent.Width - 48
                  AlignInContainer: =AlignInContainer.Center
                  FillPortions: =0
            - lblDetailDraftEmpty:
                Control: ModernText
                Properties:
                  Visible: =IfError(SectionCount(varSelected.SectionsJson), 0) = 0
                  Text: |-
                    =Switch(
                        varSelected.Status,
                        "Needs Info", "No draft yet. The Writer is waiting for answers to its questions (see Open questions).",
                        "Drafting", "No draft yet. The Writer is drafting this note.",
                        "Submitted", "No draft yet. The request is queued for the Writer.",
                        "Draft", "No draft yet. The request hasn't been submitted.",
                        "Needs Attention", "No draft yet. A workflow failed (see the error above).",
                        "Cancelled", "This request was cancelled before a draft was written.",
                        "No draft sections to show."
                    )
                  Fill: =ClrSurface
                  BorderColor: =ClrBorder
                  BorderThickness: =1
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  PaddingTop: =16
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  Size: =14
                  Color: =ClrTextSecondary
                  AutoHeight: =true
                  Wrap: =true
                  Width: =Parent.Width - 48
                  AlignInContainer: =AlignInContainer.Center
                  FillPortions: =0
                  AccessibleLabel: ="No draft sections yet"
            - lblDetailVerifHead:
                Control: ModernText
                Properties:
                  Text: =If(IsBlank(varSelected.Confidence), "Verification", "Verification · confidence " & varSelected.Confidence)
                  Size: =18
                  FontWeight: =FontWeight.Semibold
                  Color: =ClrText
                  Height: =56
                  PaddingTop: =20
                  PaddingBottom: =8
                  PaddingLeft: =0
                  PaddingRight: =0
                  Wrap: =false
                  VerticalAlign: =VerticalAlign.Bottom
                  Width: =Parent.Width - 48
                  AlignInContainer: =AlignInContainer.Center
                  FillPortions: =0
                  AccessibleLabel: =If(IsBlank(varSelected.Confidence), "Verification", "Verification, confidence " & varSelected.Confidence)
            - lblDetailVerification:
                Control: ModernText
                Properties:
                  Text: =If(IsBlank(varSelected.Verification), "No verification notes.", varSelected.Verification)
                  Fill: =ClrSurface
                  BorderColor: =ClrBorder
                  BorderThickness: =1
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  PaddingTop: =16
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  Size: =14
                  Color: =If(IsBlank(varSelected.Verification), ClrTextSecondary, ClrText)
                  AutoHeight: =true
                  Wrap: =true
                  Width: =Parent.Width - 48
                  AlignInContainer: =AlignInContainer.Center
                  FillPortions: =0
                  AccessibleLabel: =If(IsBlank(varSelected.Verification), "No verification notes.", varSelected.Verification)
            - lblDetailQuestionsHead:
                Control: ModernText
                Properties:
                  Text: ="Open questions for the requester"
                  Visible: =!IsBlank(varSelected.Questions)
                  Size: =18
                  FontWeight: =FontWeight.Semibold
                  Color: =ClrText
                  Height: =56
                  PaddingTop: =20
                  PaddingBottom: =8
                  PaddingLeft: =0
                  PaddingRight: =0
                  Wrap: =false
                  VerticalAlign: =VerticalAlign.Bottom
                  Width: =Parent.Width - 48
                  AlignInContainer: =AlignInContainer.Center
                  FillPortions: =0
                  AccessibleLabel: ="Open questions for the requester"
            - lblDetailQuestions:
                Control: ModernText
                Properties:
                  Text: =varSelected.Questions
                  Visible: =!IsBlank(varSelected.Questions)
                  Fill: =RGBA(255, 244, 206, 1)
                  BorderColor: =RGBA(255, 244, 206, 1)
                  BorderThickness: =1
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  PaddingTop: =16
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  Size: =14
                  Color: =ClrText
                  AutoHeight: =true
                  Wrap: =true
                  Width: =Parent.Width - 48
                  AlignInContainer: =AlignInContainer.Center
                  FillPortions: =0
                  AccessibleLabel: =varSelected.Questions
            - lblDetailSourcesHead:
                Control: ModernText
                Properties:
                  Text: ="Sources (" & CountRows(Filter(colSources, RequestId = varSelected.Id)) & ")"
                  Size: =18
                  FontWeight: =FontWeight.Semibold
                  Color: =ClrText
                  Height: =56
                  PaddingTop: =20
                  PaddingBottom: =8
                  PaddingLeft: =0
                  PaddingRight: =0
                  Wrap: =false
                  VerticalAlign: =VerticalAlign.Bottom
                  Width: =Parent.Width - 48
                  AlignInContainer: =AlignInContainer.Center
                  FillPortions: =0
                  AccessibleLabel: ="Sources, " & CountRows(Filter(colSources, RequestId = varSelected.Id)) & " documents"
            - galDetailSources:
                Control: Gallery
                Variant: Vertical
                Properties:
                  Items: =SortByColumns(Filter(colSources, RequestId = varSelected.Id), "Label", SortOrder.Ascending)
                  TemplateSize: =64
                  TemplatePadding: =0
                  Height: =CountRows(Filter(colSources, RequestId = varSelected.Id)) * 64
                  Visible: =CountRows(Filter(colSources, RequestId = varSelected.Id)) > 0
                  Fill: =ClrSurface
                  BorderColor: =ClrBorder
                  BorderThickness: =1
                  ShowScrollbar: =false
                  Selectable: =false
                  Width: =Parent.Width - 48
                  AlignInContainer: =AlignInContainer.Center
                  FillPortions: =0
                  AccessibleLabel: ="Source documents"
                Children:
                  - conDetailSrcRow:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Horizontal
                        Width: =Parent.TemplateWidth
                        Height: =Parent.TemplateHeight
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =10
                        PaddingBottom: =10
                        LayoutGap: =12
                        LayoutAlignItems: =LayoutAlignItems.Center
                        BorderColor: =ClrBorder
                        BorderThickness: =1
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                      Children:
                        - bdgDetailSrcLabel:
                            Control: ModernBadge
                            Properties:
                              Content: =ThisItem.Label
                              Fill: =ClrAccentTint
                              BorderColor: =ClrAccentTint
                              Color: =ClrAccent
                              Appearance: =BadgeAppearance.Tint
                              Shape: =BadgeShape.Rounded
                              Size: =12
                              FontWeight: =FontWeight.Semibold
                              Width: =44
                              Height: =26
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Center
                              AccessibleLabel: ="Source " & ThisItem.Label
                        - conDetailSrcText:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Vertical
                              FillPortions: =1
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                              Height: =44
                              LayoutGap: =2
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              AlignInContainer: =AlignInContainer.Center
                            Children:
                              - lblDetailSrcName:
                                  Control: ModernText
                                  Properties:
                                    Text: =ThisItem.FileName
                                    Size: =14
                                    FontWeight: =FontWeight.Semibold
                                    Color: =ClrText
                                    Height: =22
                                    FillPortions: =0
                                    Wrap: =false
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AccessibleLabel: ="File " & ThisItem.FileName
                              - lblDetailSrcSummary:
                                  Control: ModernText
                                  Properties:
                                    Text: =ThisItem.Summary
                                    Size: =12
                                    Color: =ClrTextSecondary
                                    Height: =18
                                    FillPortions: =0
                                    Wrap: =false
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AccessibleLabel: =ThisItem.Summary
                        - lblDetailSrcType:
                            Control: ModernText
                            Properties:
                              Text: |-
                                =ThisItem.DocType & Char(10) & Text(ThisItem.Characters, "#,##0") & " characters"
                              Size: =12
                              Color: =ClrTextSecondary
                              Align: =Align.Right
                              Width: =190
                              Height: =40
                              FillPortions: =0
                              Wrap: =true
                              VerticalAlign: =VerticalAlign.Middle
                              PaddingTop: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              AlignInContainer: =AlignInContainer.Center
                              AccessibleLabel: |-
                                =ThisItem.DocType & ", " & Text(ThisItem.Characters, "#,##0") & " characters"
            - lblDetailSourcesEmpty:
                Control: ModernText
                Properties:
                  Visible: =CountRows(Filter(colSources, RequestId = varSelected.Id)) = 0
                  Text: ="No source documents."
                  Fill: =ClrSurface
                  BorderColor: =ClrBorder
                  BorderThickness: =1
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  PaddingTop: =16
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  Size: =14
                  Color: =ClrTextSecondary
                  AutoHeight: =true
                  Wrap: =true
                  Width: =Parent.Width - 48
                  AlignInContainer: =AlignInContainer.Center
                  FillPortions: =0
                  AccessibleLabel: ="No source documents."
            - lblDetailTimelineHead:
                Control: ModernText
                Properties:
                  Text: ="Timeline (newest first)"
                  Size: =18
                  FontWeight: =FontWeight.Semibold
                  Color: =ClrText
                  Height: =56
                  PaddingTop: =20
                  PaddingBottom: =8
                  PaddingLeft: =0
                  PaddingRight: =0
                  Wrap: =false
                  VerticalAlign: =VerticalAlign.Bottom
                  Width: =Parent.Width - 48
                  AlignInContainer: =AlignInContainer.Center
                  FillPortions: =0
                  AccessibleLabel: ="Timeline, newest first"
            - galDetailTimeline:
                Control: Gallery
                Variant: Vertical
                Properties:
                  Items: =SortByColumns(Filter(colActivities, RequestId = varSelected.Id), "CreatedOn", SortOrder.Descending)
                  TemplateSize: =64
                  TemplatePadding: =0
                  Height: =CountRows(Filter(colActivities, RequestId = varSelected.Id)) * 64
                  Visible: =CountRows(Filter(colActivities, RequestId = varSelected.Id)) > 0
                  Fill: =ClrSurface
                  BorderColor: =ClrBorder
                  BorderThickness: =1
                  ShowScrollbar: =false
                  Selectable: =false
                  Width: =Parent.Width - 48
                  AlignInContainer: =AlignInContainer.Center
                  FillPortions: =0
                  AccessibleLabel: ="Activity timeline"
                Children:
                  - conDetailTlRow:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Horizontal
                        Width: =Parent.TemplateWidth
                        Height: =Parent.TemplateHeight
                        PaddingLeft: =0
                        PaddingRight: =16
                        PaddingTop: =10
                        PaddingBottom: =10
                        LayoutGap: =12
                        LayoutAlignItems: =LayoutAlignItems.Center
                        BorderColor: =ClrBorder
                        BorderThickness: =1
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                      Children:
                        - rectDetailTlBar:
                            Control: Rectangle
                            Properties:
                              Width: =4
                              Height: =44
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Center
                              Fill: |-
                                =Switch(ThisItem.ActivityType, "Failed", ClrRed, "Cancelled", ClrTextSecondary, "Approved", RGBA(16, 124, 16, 1), "Delivered", RGBA(16, 124, 16, 1), "Clarification requested", RGBA(188, 75, 9, 1), "Revision requested", RGBA(92, 46, 145, 1), ClrAccent)
                        - lblDetailTlWhen:
                            Control: ModernText
                            Properties:
                              Text: =Text(ThisItem.CreatedOn, "d mmm yyyy hh:mm")
                              Size: =12
                              Color: =ClrTextSecondary
                              Width: =140
                              Height: =20
                              FillPortions: =0
                              Wrap: =false
                              PaddingTop: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              AlignInContainer: =AlignInContainer.Center
                              AccessibleLabel: =Text(ThisItem.CreatedOn, "d mmm yyyy hh:mm")
                        - conDetailTlBody:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Vertical
                              FillPortions: =1
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                              Height: =44
                              LayoutGap: =2
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              AlignInContainer: =AlignInContainer.Center
                            Children:
                              - lblDetailTlTitle:
                                  Control: ModernText
                                  Properties:
                                    Text: =ThisItem.Title & " · " & ThisItem.Actor
                                    Size: =14
                                    FontWeight: =FontWeight.Semibold
                                    Color: =ClrText
                                    Height: =22
                                    FillPortions: =0
                                    Wrap: =false
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AccessibleLabel: =ThisItem.Title & " by " & ThisItem.Actor
                              - lblDetailTlDetails:
                                  Control: ModernText
                                  Properties:
                                    Text: =ThisItem.Details
                                    Size: =12
                                    Color: =ClrTextSecondary
                                    Height: =18
                                    FillPortions: =0
                                    Wrap: =false
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AccessibleLabel: =ThisItem.Details
            - lblDetailTimelineEmpty:
                Control: ModernText
                Properties:
                  Visible: =CountRows(Filter(colActivities, RequestId = varSelected.Id)) = 0
                  Text: ="No activity recorded yet."
                  Fill: =ClrSurface
                  BorderColor: =ClrBorder
                  BorderThickness: =1
